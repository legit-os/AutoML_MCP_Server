utils:
  files:
    helpers:
      path: utils/helpers.py
    metrics:
      path: utils/metrics.py
    data_loader:
      path: utils/data_loader.py
    logger:
      path: utils/logger.py
    validators:
      path: utils/validators.py
analysis:
  files:
    summary:
      path: analysis/summary.py
      output_type: table
    correlation:
      path: analysis/correlation.py
      output_type: graph
    feature_stats:
      path: analysis/feature_stats.py
      output_type: list
pipeline:
  stages:
    preprocessing:
      elements:
        load_data:
          path: src/load.py
          depends_on:
          - utils.data_loader
        clean_data:
          path: src/clean.py
          depends_on:
          - preprocessing.load_data
          - utils.helpers
    feature_engineering:
      elements:
        create_features:
          path: src/features.py
          depends_on:
          - preprocessing.clean_data
    training:
      elements:
        train_model:
          path: src/train.py
          depends_on:
          - feature_engineering.create_features
          - utils.metrics
    evaluation:
      elements:
        evaluate_model:
          path: src/evaluate.py
          depends_on:
          - training.train_model
    serving:
      elements:
        api_server:
          path: src/serve.py
          depends_on:
          - training.train_model
          - utils.logger
