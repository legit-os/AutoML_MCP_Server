[project]
dependencies = [
  "fastmcp>=3.1.0",
  "filelock>=3.24.3",
  "flask>=3.1.3",
  "matplotlib>=3.10.8",
  "pandas>=3.0.1",
  "pydantic>=2.12.5",
  "pytest>=9.0.2",
  "pyyaml>=6.0.3",
  "requests>=2.32.5",
  "typer>=0.24.1",
  "reflex>=0.7.0",
  "fastapi>=0.135.3",
]
description = "Add your description here"
name = "automl-mcp"
readme = "README.md"
requires-python = ">=3.14"
version = "1.0.0"

[project.scripts]
automl = "dist_automl.cli:app"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/dist_automl"]
include = [
    "src/dist_automl/dashboard_maker_reflex/reflex_app/**/*"
]
